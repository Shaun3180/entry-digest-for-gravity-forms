name: Deploy assets to WordPress.org

# Publishes listing assets (banner / icon / screenshots) WITHOUT cutting a new
# release. Fires whenever you push a change under assets/ to main, so a banner
# or screenshot tweak goes live on its own - no version bump, no tag needed.
# Full plugin releases are still handled separately by deploy.yml on a tag push.
on:
  push:
    branches:
      - main
    paths:
      - "assets/**"

jobs:
  assets:
    name: Update plugin assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update WordPress.org assets
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          # Same /assets folder deploy.yml already uses; slug defaults to repo name.
          ASSETS_DIR: assets
